# Netlify serves the static export in out/. Netlify maps /rooms to rooms.html
# and uses 404.html for missing pages, so no redirects are needed.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # Add NEXT_PUBLIC_GA_ID in Netlify: Site configuration → Environment variables.

# Next.js puts a content hash in these file names, so they can be cached forever.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# The site is one page now. Old page addresses (already shared or indexed)
# go to the matching section of the home page.

[[redirects]]
  from = "/hall"
  to = "/#hall"
  status = 301

[[redirects]]
  from = "/rooms"
  to = "/#rooms"
  status = 301

[[redirects]]
  from = "/gallery"
  to = "/#gallery"
  status = 301

[[redirects]]
